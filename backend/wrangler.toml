# Deployable Cloudflare Worker + Durable Object configuration for SpotQuest v1.2.0
name = "spotquest-realtime-rooms"
main = "worker.js"
compatibility_date = "2026-11-23"

[durable_objects]
bindings = [
  { name = "SPOTQUEST_ROOMS", class_name = "SpotQuestZoneRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpotQuestZoneRoom"]
