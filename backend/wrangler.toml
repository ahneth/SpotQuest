# Deployable Cloudflare Worker + Durable Object configuration for SpotQuest v2.1.0
name = "spotquest-realtime-rooms"
main = "worker.js"
compatibility_date = "2026-11-24"

[durable_objects]
bindings = [
  { name = "SPOTQUEST_ROOMS", class_name = "SpotQuestZoneRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpotQuestZoneRoom"]
